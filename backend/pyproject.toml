[project]
name = "soft-tg-market"
version = "0.1.0"
description = "Soft-tg-Market: Telegram Premium & Stars sotuvi (bot + API)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aiogram>=3.31",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "cryptography>=43",
  "typer>=0.12",
  "openpyxl>=3.1",
  "tonutils>=2.3.0",
  "pytoniq-core>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations"]
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
