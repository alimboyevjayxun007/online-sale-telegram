# Replace premium.example.uz with your domain (certbot --nginx adds the ssl_* lines for you).
limit_req_zone $binary_remote_addr zone=premium_api:10m rate=20r/s;

server {
    listen 80;
    server_name premium.example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;   # nginx 1.24 (Ubuntu 24.04) does not know the standalone `http2 on;`
    server_name premium.example.uz;

    ssl_certificate     /etc/letsencrypt/live/premium.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/premium.example.uz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # X-Content-Type-Options and the frame-ancestors CSP (Telegram clients only) are set by the Next.js app itself

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /tg/webhook {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=premium_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /_next/static/ {
        alias /opt/premium/app/webapp/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
